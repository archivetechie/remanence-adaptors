[workspace]
members = [
    "crates/remanence-adaptors",
    "crates/remanence-bru",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Archive Technology <admin@archivetech.org>"]
license = "Apache-2.0"
repository = "https://github.com/archivetechie/remanence-adaptors"

[workspace.dependencies]
remanence-cli = { git = "https://github.com/archivetechie/remanence", rev = "f643f8c2bca7f2971b5ed3da4280fb8f4c0b0e84" }
remanence-daemon = { git = "https://github.com/archivetechie/remanence", rev = "f643f8c2bca7f2971b5ed3da4280fb8f4c0b0e84" }
remanence-format-driver = { git = "https://github.com/archivetechie/remanence", rev = "f643f8c2bca7f2971b5ed3da4280fb8f4c0b0e84" }
remanence-library = { git = "https://github.com/archivetechie/remanence", rev = "f643f8c2bca7f2971b5ed3da4280fb8f4c0b0e84" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
